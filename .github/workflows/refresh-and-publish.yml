name: Refresh and publish deals

"on":
  workflow_dispatch:
  schedule:
    - cron: "20 8 * * *"
    - cron: "20 14 * * *"
    - cron: "20 20 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-and-publish
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh generated data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh source data
        run: npm run refresh:data
        env:
          OCR_SPACE_API_KEY: ${{ secrets.OCR_SPACE_API_KEY }}

      - name: Refuse empty publication
        run: node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('public/data/raw-candidates.json','utf8')); if (!p.candidates?.length) { console.error('Source refresh returned zero candidates; refusing to publish.'); process.exit(1); }"

      - name: Validate
        run: |
          npm test
          npm run typecheck
          npm run build

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/*.json
          if git diff --cached --quiet; then
            echo "No generated data changes to commit."
          else
            git commit -m "Refresh generated grocery deals"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy GitHub Pages
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
